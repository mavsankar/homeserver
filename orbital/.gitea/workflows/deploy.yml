name: Deploy Orbital

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker CLI
        run: apk add --no-cache docker-cli

      - name: Build and deploy
        run: |
          docker build -t orbital .
          docker stop orbital 2>/dev/null || true
          docker rm orbital 2>/dev/null || true
          docker run -d --name orbital --restart always \
            --network homeserver \
            --expose 8083 \
            orbital
