name: observability

services:
  # ---------------------------------------------------------------------------
  # Loki — stores activity / audit logs. Internal only (no nginx server block).
  # ---------------------------------------------------------------------------
  loki:
    build: ./loki
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - homeserver

  # ---------------------------------------------------------------------------
  # Grafana — dashboards. Exposed at homedashboard.mavsankar.com via nginx.
  # ---------------------------------------------------------------------------
  grafana:
    build: ./grafana
    container_name: grafana
    restart: unless-stopped
    env_file: .env
    environment:
      - GF_SERVER_ROOT_URL=https://homedashboard.mavsankar.com
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - loki
    networks:
      - homeserver

  # ---------------------------------------------------------------------------
  # Telemetry gateway — public ingest endpoint for the JISST app.
  #   /web    : anonymous browser beacons  (CORS, no auth, PII stripped)
  #   /server : backend audit events       (Bearer token, email allowed)
  # Exposed at homejisst-ingest.mavsankar.com via nginx.
  # ---------------------------------------------------------------------------
  telemetry-gateway:
    build: ./gateway
    container_name: telemetry-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8888
      - LOKI_URL=http://loki:3100
      - NODE_ENV=production
      - INGEST_TOKEN=${INGEST_TOKEN}
      - ALLOWED_ORIGINS=${INGEST_ALLOWED_ORIGINS}
    expose:
      - "8888"
    depends_on:
      - loki
    networks:
      - homeserver

volumes:
  loki-data:
  grafana-data:

networks:
  homeserver:
    external: true
    name: homeserver
