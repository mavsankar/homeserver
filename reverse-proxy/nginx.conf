worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_names_hash_bucket_size 64;

    ## CORS origin whitelist
    map $http_origin $cors_origin {
        default "";
        "https://home.mavsankar.com"  $http_origin;
        "https://blog.mavsankar.com"  $http_origin;
        "http://127.0.0.1:4000"       $http_origin;
        "https://jisst.com"           $http_origin;
        "https://www.jisst.com"       $http_origin;
        "https://fsrti.jisst.com"     $http_origin;
    }

    # Use Docker's internal DNS with short TTL so container IP changes are picked up
    resolver 127.0.0.11 valid=10s;

    sendfile on;
    keepalive_timeout 65;

    # Prevent nginx from appending :8000 to redirects
    port_in_redirect off;
    absolute_redirect off;

    ##
    ## LOGGING
    ##
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    ##
    ## HOMEPAGE DASHBOARD
    ## home.mavsankar.com → homepage container
    ##
    server {
        listen 8000;
        server_name home.mavsankar.com;

        location / {
            set $upstream http://homepage:3000;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
        }

        location /devtoolbox/ {
            set $upstream http://dev-tools:8081;
            rewrite ^/devtoolbox/(.*)$ /$1 break;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
        }

        location /notes/ {
            set $upstream http://note-taking-app:8082;
            rewrite ^/notes/(.*)$ /$1 break;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
        }
    }

    ##
    ## Stats
    ## homestats.mavsankar.com → glances container
    ##
    server {
        listen 8000;
        server_name homestats.mavsankar.com;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://glances:61208;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
        }
    }

    ##
    ## GIT
    ## homegit.mavsankar.com → gitea container
    ##
    server {
        listen 8000;
        server_name homegit.mavsankar.com;

        client_max_body_size 100M;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://gitea:3000;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    ##
    ## BOOKS (Kavita)
    ## homebooks.mavsankar.com → kavita container
    ##
    server {
        listen 8000;
        server_name homebooks.mavsankar.com;

        client_max_body_size 100M;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://kavita:5000;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## WORKFLOWS (n8n)
    ## homeworkflows.mavsankar.com → n8n container
    ##
    server {
        listen 8000;
        server_name homeworkflows.mavsankar.com;

        # Block internal-only webhooks from public access
        include /etc/nginx/snippets/internal_webhooks.conf;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://n8n:5678;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## RMM (MeshCentral)
    ## homermm.mavsankar.com → meshcentral container
    ##
    server {
        listen 8000;
        server_name homermm.mavsankar.com;

        client_max_body_size 1G;

        location / {
            include /etc/nginx/snippets/cors.conf;

            set $upstream http://meshcentral:443;
            proxy_pass $upstream;

            include /etc/nginx/snippets/proxy_params.conf;
            proxy_set_header X-Forwarded-Proto https;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## LINKS (Linkwarden)
    ## homelinks.mavsankar.com → linkwarden container
    ##
    server {
        listen 8000;
        server_name homelinks.mavsankar.com;

        client_max_body_size 50M;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://linkwarden:3000;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## MEMOS (Thoughts / Ideas)
    ## homememos.mavsankar.com → memos container
    ##
    server {
        listen 8000;
        server_name homememos.mavsankar.com;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://memos:5230;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## AI (Open WebUI + Ollama)
    ## homeai.mavsankar.com → open-webui container
    ##
    server {
        listen 8000;
        server_name homeai.mavsankar.com;

        client_max_body_size 50M;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://open-webui:8080;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## HOME ASSISTANT (Smart Home)
    ## homeauto.mavsankar.com → homeassistant container
    ##
    server {
        listen 8000;
        server_name homeauto.mavsankar.com;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://homeassistant:8123;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## STIRLING-PDF (PDF Tools)
    ## homepdf.mavsankar.com → stirling-pdf container
    ##
    server {
        listen 8000;
        server_name homepdf.mavsankar.com;

        client_max_body_size 100M;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://stirling-pdf:8080;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
        }
    }

    ##
    ## SPEEDTEST TRACKER
    ## homespeed.mavsankar.com → speedtest-tracker container
    ##
    server {
        listen 8000;
        server_name homespeed.mavsankar.com;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://speedtest-tracker:80;
            proxy_pass $upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;

            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## TELUGU CALENDAR (Panchangam)
    ## homecalendar.mavsankar.com → telugu-calendar container
    ##
    server {
        listen 8000;
        server_name homecalendar.mavsankar.com;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://telugu-calendar:8085;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
        }
    }

    ##
    ## DOZZLE (Container Logs)
    ## homelogs.mavsankar.com → dozzle container
    ##
    server {
        listen 8000;
        server_name homelogs.mavsankar.com;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://dozzle:8080;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## FILE SHARE (Zipline)
    ## homeshare.mavsankar.com → zipline container
    ##
    server {
        listen 8000;
        server_name homeshare.mavsankar.com;

        client_max_body_size 1G;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://zipline:3000;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## CONVERTX (File Converter)
    ## homeconvert.mavsankar.com → convertx container
    ##
    server {
        listen 8000;
        server_name homeconvert.mavsankar.com;

        client_max_body_size 2G;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://convertx:3000;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## OBSERVABILITY — GRAFANA DASHBOARDS
    ## homedashboard.mavsankar.com → grafana container
    ##
    server {
        listen 8000;
        server_name homedashboard.mavsankar.com;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://grafana:3000;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## ERROR TRACKING — GLITCHTIP
    ## homejisst-errors.mavsankar.com → glitchtip-web container
    ##
    server {
        listen 8000;
        server_name homejisst-errors.mavsankar.com;

        client_max_body_size 30M;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://glitchtip-web:8080;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## TELEMETRY INGEST — JISST app activity beacons
    ## homejisst-ingest.mavsankar.com → telemetry-gateway container
    ##
    server {
        listen 8000;
        server_name homejisst-ingest.mavsankar.com;

        client_max_body_size 256k;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://telemetry-gateway:8888;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
        }
    }

    ##
    ## BACKREST (Backups & Restore)
    ## homebackup.mavsankar.com → backrest container
    ##
    server {
        listen 8000;
        server_name homebackup.mavsankar.com;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://backrest:9898;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## RESTIC REST (backrest repo endpoint — cross-machine restore)
    ## homerestic.mavsankar.com → restic-rest container
    ## Encrypted repo + rest-server basic auth + append-only.
    ##
    server {
        listen 8000;
        server_name homerestic.mavsankar.com;

        client_max_body_size 0;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://restic-rest:8000;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
        }
    }

    ##
    ## CODE SERVER (Browser VS Code for Gitea repos)
    ## homecode.mavsankar.com → code-server container
    ## /_open is the clone-on-demand bridge used by Gitea's "." shortcut.
    ##
    server {
        listen 8000;
        server_name homecode.mavsankar.com;

        client_max_body_size 1G;

        location /_open {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://code-server-open:8090;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            proxy_read_timeout 900;
        }

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://code-server:8443;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
            include /etc/nginx/snippets/websocket.conf;
        }
    }

    ##
    ## ORBITAL (Gravity Slingshot Game)
    ## orbital.mavsankar.com → orbital container
    ##
    server {
        listen 8000;
        server_name orbital.mavsankar.com;

        location / {
            include /etc/nginx/snippets/cors.conf;
            set $upstream http://orbital:8083;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_params.conf;
        }
    }
}
