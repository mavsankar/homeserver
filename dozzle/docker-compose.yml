name: dozzle

services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: always
    expose:
      - "8080"
    environment:
      - TZ=Asia/Kolkata
      - DOZZLE_ENABLE_ACTIONS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - homeserver

networks:
  homeserver:
    external: true
    name: homeserver
